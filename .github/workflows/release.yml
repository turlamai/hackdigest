name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# One release pipeline per tag at a time; never cancel a publishing run
# (a half-published release is worse than a queued one).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package.json, backend app-version, and CHANGELOG
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: skipping tag validation, building from package.json version"
            exit 0
          fi
          TAG="${GITHUB_REF_NAME#v}"
          ROOT_VERSION=$(node -p "require('./package.json').version")
          BACKEND_VERSION=$(sed -n 's/.*(define app-version "\([^"]*\)").*/\1/p' backend/main.rkt)
          echo "tag=$TAG package.json=$ROOT_VERSION backend=$BACKEND_VERSION"
          test -n "$BACKEND_VERSION" || { echo "::error::backend/main.rkt has no app-version"; exit 1; }
          test "$TAG" = "$ROOT_VERSION" || { echo "::error::tag $TAG != package.json $ROOT_VERSION"; exit 1; }
          test "$TAG" = "$BACKEND_VERSION" || { echo "::error::tag $TAG != backend app-version $BACKEND_VERSION"; exit 1; }
          grep -q "^## $TAG" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $TAG' section"; exit 1; }
      - name: Require Ed25519 update signing secret before packaging
        if: github.event_name == 'push'
        shell: bash
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        run: |
          if [[ -z "${UPDATE_ED25519_PRIVATE_KEY:-}" ]]; then
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; refusing unsigned release before expensive builds"
            exit 1
          fi

  macos:
    name: macOS package (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            racket-arch: arm64
          - arch: x64
            runner: macos-15-intel
            racket-arch: x64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#671ea4dcacbfbfedd74a167de8ec9c1a53db51d6

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: App icon (icns from icon-1024.png)
        run: |
          ICONSET=dist/icon.iconset
          mkdir -p "$ICONSET"
          for spec in 16 32 128 256 512; do
            sips -z $spec $spec icon-1024.png --out "$ICONSET/icon_${spec}x${spec}.png" >/dev/null
            dbl=$((spec * 2))
            sips -z $dbl $dbl icon-1024.png --out "$ICONSET/icon_${spec}x${spec}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o dist/HackDigest.icns
          rm -rf "$ICONSET"

      - name: Package app bundle
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name HackDigest \
            --version "$VERSION" \
            --icon dist/HackDigest.icns \
            --sign - \
            --out dist

      # Two-phase smoke over the packaged artifact. Phase 1 is the
      # production shape: HACKDIGEST_SELFTEST drives the packaged binary in
      # its native transport (glaze:// page, GLZ1 handler) and the app
      # asserts its own page render + capture, then exits — non-zero on
      # any failure, no browser fallback. Phase 2 keeps the HTTP adapter
      # (explicit dev transport) honest: the same packaged engine must
      # serve api/health and the frontend over loopback.
      - name: Native launch selftest (packaged binary, production transport)
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          HACKDIGEST_SELFTEST=1 HACKDIGEST_DATA_DIR="$data_dir" \
            ./dist/HackDigest.app/Contents/MacOS/HackDigest &
          app_pid=$!
          trap 'kill -9 $app_pid 2>/dev/null || true' exit
          deadline=$((SECONDS + 120))
          while kill -0 "$app_pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do
            sleep 2
          done
          if kill -0 "$app_pid" 2>/dev/null; then
            echo "::error::native selftest did not terminate in 120s"
            exit 1
          fi
          status=0
          wait "$app_pid" || status=$?
          [ "$status" -eq 0 ] || { echo "::error::native selftest failed (exit $status)"; exit 1; }

      - name: HTTP adapter smoke (packaged binary serves API and frontend)
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          HACKDIGEST_TRANSPORT=http HACKDIGEST_DATA_DIR="$data_dir" GLAZE_API_TOKEN=smoke-token \
            ./dist/HackDigest.app/Contents/MacOS/HackDigest &
          app_pid=$!
          trap 'kill -9 $app_pid 2>/dev/null || true' exit
          # The app holds several listening sockets (single-instance guard,
          # HTTP server) and their order is not stable: probe every port
          # and let the health endpoint decide which one is the app (same
          # policy as the Linux and Windows smokes).
          port=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$app_pid" 2>/dev/null || { echo "::error::packaged app exited early"; exit 1; }
            for p in $(lsof -a -p "$app_pid" -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u); do
              if curl -fsS -m 10 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                port="$p"
                break
              fi
            done
            [ -n "$port" ] && break
          done
          [ -n "$port" ] || { echo "::error::packaged app never listened"; exit 1; }
          curl -fsS -m 5 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$port/api/health" | grep -q '"ok":true'
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }

      - name: Portable zip (.app at the archive root)
        run: |
          # Written to the repo root (not dist/) so both artifact paths
          # share the checkout root and upload-artifact stores them flat.
          (cd dist && zip -qry "../hackdigest-$VERSION-macos-${{ matrix.arch }}.zip" HackDigest.app)

      - name: Human installer (DMG, drag to Applications)
        run: |
          set -euo pipefail
          dmg="hackdigest-$VERSION-macos-${{ matrix.arch }}.dmg"
          staging="$(mktemp -d)/dmg-stage"
          mkdir -p "$staging"
          cp -R dist/HackDigest.app "$staging/"
          ln -s /Applications "$staging/Applications"
          # hdiutil create intermittently fails with "Resource busy" on CI
          # runners (Spotlight/mds holding the staging dir) — retry.
          created=""
          for attempt in 1 2 3; do
            if hdiutil create -volname HackDigest -srcfolder "$staging" -ov -format UDZO "$dmg"; then
              created="yes"
              break
            fi
            echo "hdiutil create attempt $attempt failed; retrying in 5s"
            sleep 5
          done
          [ -n "$created" ] || { echo "::error::hdiutil create failed after 3 attempts"; exit 1; }
          hdiutil attach "$dmg" -mountpoint /tmp/hd-dmg-verify -readonly
          test -d /tmp/hd-dmg-verify/HackDigest.app
          hdiutil detach /tmp/hd-dmg-verify

      - name: Per-asset .sha256 sidecars
        run: |
          set -euo pipefail
          for f in hackdigest-$VERSION-macos-*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || shasum -a 256 "$f" > "$f.sha256" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            hackdigest-*-macos-${{ matrix.arch }}.dmg
            hackdigest-*-macos-${{ matrix.arch }}.dmg.sha256
            hackdigest-*-macos-${{ matrix.arch }}.zip
            hackdigest-*-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }} (tar.gz + deb)
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
            racket-arch: x64
          - arch: arm64
            runner: ubuntu-24.04-arm
            racket-arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Install WebKit/GTK runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev xvfb imagemagick rpm

      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: ${{ matrix.racket-arch }}
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#671ea4dcacbfbfedd74a167de8ec9c1a53db51d6

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: Package distribution directory
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name HackDigest \
            --version "$VERSION" \
            --out dist
          test -x dist/bin/HackDigest || { echo "::error::dist/bin/HackDigest executable missing"; exit 1; }
          test -d dist/lib || { echo "::error::dist/lib missing"; exit 1; }

      # Two-phase smoke (see the macOS job for the rationale). Both phases
      # need a real display: xvfb hosts the WebKitGTK window, and
      # WEBKIT_DISABLE_DMABUF_RENDERER avoids the GPU-dependent renderer
      # on the runner. The launcher lands in dist/bin while public/ sits
      # in dist/, so start it with dist/ as the working directory.
      - name: Native launch selftest (packaged binary, production transport)
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          data_dir="$(mktemp -d)"
          cd dist
          HACKDIGEST_SELFTEST=1 HACKDIGEST_DATA_DIR="$data_dir" \
            setsid xvfb-run -a ./bin/HackDigest &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          deadline=$((SECONDS + 120))
          while kill -0 "$run_pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do
            sleep 2
          done
          if kill -0 "$run_pid" 2>/dev/null; then
            echo "::error::native selftest did not terminate in 120s"
            exit 1
          fi
          status=0
          wait "$run_pid" || status=$?
          [ "$status" -eq 0 ] || { echo "::error::native selftest failed (exit $status)"; exit 1; }

      # HTTP adapter (explicit dev transport): probe every listening TCP
      # port with the token-protected health endpoint — only our server
      # can answer it, so the health check itself decides which port is
      # the app (same policy as the Windows smoke).
      - name: HTTP adapter smoke (packaged binary serves API and frontend)
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          data_dir="$(mktemp -d)"
          export HACKDIGEST_TRANSPORT=http HACKDIGEST_DATA_DIR="$data_dir" GLAZE_API_TOKEN=smoke-token
          cd dist
          setsid xvfb-run -a ./bin/HackDigest &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          health_port=""
          ports=""
          for _ in $(seq 1 15); do
            sleep 2
            kill -0 "$run_pid" 2>/dev/null || { echo "::error::packaged app exited early"; exit 1; }
            ports="$(lsof -iTCP -sTCP:LISTEN -P -n 2>/dev/null | grep -oE ':[0-9]+' | tr -d ':' | sort -u || true)"
            for p in $ports; do
              if curl -fsS -m 5 -H "X-Glaze-Token: smoke-token" "http://127.0.0.1:$p/api/health" 2>/dev/null | grep -q '"ok":true'; then
                health_port="$p"
                break
              fi
            done
            [ -n "$health_port" ] && break
          done
          [ -n "$health_port" ] || { echo "::error::packaged app never answered api/health (ports: ${ports:-none})"; exit 1; }
          code="$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://127.0.0.1:$health_port/")"
          [ "$code" = "200" ] || { echo "::error::frontend returned $code"; exit 1; }

      - name: Tar the distribution
        run: |
          stage="$(mktemp -d)/HackDigest"
          mkdir -p "$stage"
          cp -R dist/. "$stage/"
          tar -czf "hackdigest-$VERSION-linux-${{ matrix.arch }}.tar.gz" -C "$(dirname "$stage")" HackDigest

      # Hand-rolled deb (this pipeline does not use glaze build --installer):
      # dpkg-deb is on every ubuntu runner. FHS layout per the task spec —
      # payload at /opt/hackdigest (the launcher's relative bin/ + lib/plt
      # resolution stays intact), a hackdigest wrapper on PATH, a desktop
      # entry and hicolor icons for menu integration. Depends names what
      # the app actually FFI-loads at runtime (glaze webview-linux: gtk-3,
      # webkit2gtk-4.1 with a 4.0 fallback; the updater's crypto package:
      # libcrypto.so.3; external links and the linux update reveal:
      # xdg-open). Everything else (glib/gobject/pixbuf/graphene/...) is
      # pulled in transitively by these.
      - name: Package deb
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)   deb_arch=amd64 ;;
            arm64) deb_arch=arm64 ;;
            *) echo "::error::no deb arch mapping for ${{ matrix.arch }}"; exit 1 ;;
          esac
          root="$(mktemp -d)/hackdigest-deb"
          mkdir -p "$root/DEBIAN" \
                   "$root/opt/hackdigest" \
                   "$root/usr/bin" \
                   "$root/usr/share/applications"
          cp -R dist/. "$root/opt/hackdigest/"
          cat > "$root/usr/bin/hackdigest" <<'EOF'
          #!/bin/sh
          exec /opt/hackdigest/bin/HackDigest "$@"
          EOF
          chmod 755 "$root/usr/bin/hackdigest"
          for s in 16 24 32 48 64 128 256 512; do
            dir="$root/usr/share/icons/hicolor/${s}x${s}/apps"
            mkdir -p "$dir"
            convert icon-1024.png -resize ${s}x${s} "$dir/hackdigest.png"
          done
          cat > "$root/usr/share/applications/hackdigest.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HackDigest
          GenericName=Hacker News reader
          Comment=Hacker News with built-in translation and AI digests
          Exec=/usr/bin/hackdigest
          Icon=hackdigest
          Terminal=false
          Categories=Network;Utility;
          EOF
          installed_size="$(du -sk --apparent-size "$root/opt/hackdigest" | cut -f1)"
          cat > "$root/DEBIAN/control" <<EOF
          Package: hackdigest
          Version: $VERSION
          Architecture: $deb_arch
          Maintainer: Turing Lambda <jirentianxiang1024@gmail.com>
          Section: net
          Priority: optional
          Installed-Size: $installed_size
          Depends: libwebkit2gtk-4.1-0 | libwebkit2gtk-4.0-37, libgtk-3-0, libssl3, xdg-utils
          Homepage: https://github.com/turlamai/hackdigest
          Description: Hacker News reader with built-in translation and AI digests
           HackDigest turns Hacker News into your language: on-demand translation
           of stories and comment threads, three-layer AI digests (article TL;DR,
           thread digest, daily digest), and a keyboard-first UI served by a
           Racket (Glaze) backend in a native WebKitGTK window.
           .
           Bring your own OpenAI-compatible API key (GLM, DeepSeek, Qwen, Kimi,
           OpenAI, or a local Ollama). Data stays local in SQLite.
          EOF
          cat > "$root/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor || true
          fi
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q || true
          fi
          EOF
          chmod 755 "$root/DEBIAN/postinst"
          dpkg-deb --root-owner-group --build "$root" "hackdigest-$VERSION-linux-${{ matrix.arch }}.deb"
          dpkg-deb -I "hackdigest-$VERSION-linux-${{ matrix.arch }}.deb"

      # Depends sufficiency proof: install the deb into a clean Ubuntu
      # 22.04 container where the ONLY extra packages are the test harness
      # itself (xvfb to host the window). If a runtime FFI library were
      # missing from Depends, apt would fail to resolve — and if the app
      # still could not start with what Depends pulled in, the launch
      # check below dies. The deep API/frontend probe already ran on the
      # runner; this asserts the deb installs and boots with declared deps
      # alone (Debian arch names differ from the asset naming: amd64/arm64).
      - name: deb Depends test (clean ubuntu:22.04 container)
        run: |
          set -euo pipefail
          deb="hackdigest-$VERSION-linux-${{ matrix.arch }}.deb"
          docker run --rm -v "$PWD:/work" -w /work -e DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -euc '
            apt-get update -qq
            apt-get install -y --no-install-recommends "./'"$deb"'" xvfb
            test -x /opt/hackdigest/bin/HackDigest
            test -x /usr/bin/hackdigest
            test -f /usr/share/applications/hackdigest.desktop
            test -f /usr/share/icons/hicolor/256x256/apps/hackdigest.png
            mkdir -p /tmp/hd-data
            export WEBKIT_DISABLE_DMABUF_RENDERER=1
            export HACKDIGEST_DATA_DIR=/tmp/hd-data GLAZE_API_TOKEN=deb-smoke
            timeout 30 xvfb-run -a /usr/bin/hackdigest >/tmp/hd-deb-smoke.log 2>&1 &
            app_pid=$!
            sleep 15
            if kill -0 "$app_pid" 2>/dev/null; then
              echo "deb install: app process alive after 15s with declared deps only"
            else
              echo "::error::app died under declared Depends only; smoke log:"
              cat /tmp/hd-deb-smoke.log
              exit 1
            fi
          '

      # Hand-rolled rpm, mirroring the deb layout and rivet's rpmbuild
      # recipe: a generated spec, a STAGED tree copied into the buildroot
      # in %install, no %dist tag (one rpm validates on any rpm-based
      # distribution), and the libtinfo exclude that keeps the Ubuntu-built
      # Racket runtime installable on Fedora. Requires names what the app
      # FFI-loads at runtime — the same set the deb Depends declares
      # (Fedora spellings: gtk3, webkit2gtk4.1, openssl-libs).
      - name: Package rpm
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)   rpm_arch=x86_64 ;;
            arm64) rpm_arch=aarch64 ;;
            *) echo "::error::no rpm arch mapping for ${{ matrix.arch }}"; exit 1 ;;
          esac
          topdir="$PWD/.rpm-build"
          rm -rf "$topdir"
          mkdir -p "$topdir/SPECS" \
                   "$topdir/STAGED/opt/hackdigest" \
                   "$topdir/STAGED/usr/bin" \
                   "$topdir/STAGED/usr/share/applications" \
                   "$topdir/STAGED/usr/share/pixmaps"
          cp -R dist/. "$topdir/STAGED/opt/hackdigest/"
          cat > "$topdir/STAGED/usr/bin/hackdigest" <<'EOF'
          #!/bin/sh
          exec /opt/hackdigest/bin/HackDigest "$@"
          EOF
          chmod 755 "$topdir/STAGED/usr/bin/hackdigest"
          convert icon-1024.png -resize 256x256 "$topdir/STAGED/usr/share/pixmaps/hackdigest.png"
          cat > "$topdir/STAGED/usr/share/applications/hackdigest.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HackDigest
          GenericName=Hacker News reader
          Comment=Hacker News with built-in translation and AI digests
          Exec=/usr/bin/hackdigest
          Icon=hackdigest
          Terminal=false
          Categories=Network;Utility;
          EOF
          cat > "$topdir/SPECS/hackdigest.spec" <<'EOF'
          %global __requires_exclude ^libtinfo\\.so\\.6\\(NCURSES6_TINFO_.*$
          Name:           hackdigest
          Version:        __HD_VERSION__
          Release:        1
          Summary:        Hacker News reader with built-in translation and AI digests
          License:        AGPL-3.0
          URL:            https://github.com/turlamai/hackdigest
          BuildArch:      __HD_ARCH__
          Requires:       gtk3
          Requires:       webkit2gtk4.1
          Requires:       openssl-libs
          Requires:       xdg-utils

          %description
          Hacker News in your language: on-demand translation, three-layer AI
          digests, and a keyboard-first UI served by a Racket (Glaze) backend
          in a native WebKitGTK window.

          %prep

          %build

          %install
          rm -rf "%{buildroot}"
          mkdir -p "%{buildroot}"
          cp -a "%{_topdir}/STAGED/." "%{buildroot}/"

          %files
          %dir "/opt/hackdigest"
          "/opt/hackdigest/*"
          "/usr/bin/hackdigest"
          "/usr/share/applications/hackdigest.desktop"
          "/usr/share/pixmaps/hackdigest.png"
          EOF
          sed -i "s/__HD_VERSION__/$VERSION/; s/__HD_ARCH__/$rpm_arch/" "$topdir/SPECS/hackdigest.spec"
          rpmbuild -bb --define="_topdir $topdir" \
                        --define="_rpmdir $PWD" \
                        --define="_build_name_fmt %{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}.rpm" \
                        "$topdir/SPECS/hackdigest.spec"
          # Family naming carries the native rpm arch spelling
          # (x86_64/aarch64), like the rivet-built rpms on
          # taskly/brainfuel/payback.
          mv "hackdigest-$VERSION-1.$rpm_arch.rpm" "hackdigest-$VERSION-1-linux-$rpm_arch.rpm"
          rm -rf "$topdir"

      # Optional-family format on both architectures. appimagetool from its
      # official continuous release, verified against the sha256 digest
      # GitHub computes for the per-arch asset. APPIMAGE_EXTRACT_AND_RUN
      # keeps everything working on FUSE-less runners (tool build,
      # self-check, smoke). Like the tar.gz and deb, the AppImage relies on
      # the system WebKitGTK — it bundles the app, not the desktop stack.
      - name: Package AppImage
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64)   tool_arch=x86_64 ;;
            arm64) tool_arch=aarch64 ;;
            *) echo "::error::no appimagetool arch mapping for ${{ matrix.arch }}"; exit 1 ;;
          esac
          asset="appimagetool-$tool_arch.AppImage"
          api_url="https://api.github.com/repos/AppImage/appimagetool/releases/tags/continuous"
          expected="$(curl -fsSL "$api_url" | jq -r ".assets[] | select(.name == \"$asset\") | .digest" | sed 's/^sha256://')"
          curl -fsSL -o "$asset" "https://github.com/AppImage/appimagetool/releases/download/continuous/$asset"
          actual="$(sha256sum "$asset" | awk '{print $1}')"
          if [ -z "$expected" ] || [ "$actual" != "$expected" ]; then
            echo "::error::appimagetool checksum mismatch (expected ${expected:-none}, got $actual)"
            exit 1
          fi
          chmod +x "$asset"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./"$asset" --version | grep -q appimagetool || { echo "::error::appimagetool does not run"; exit 1; }

          appdir="$(mktemp -d)/HackDigest.AppDir"
          mkdir -p "$appdir/usr/bin" \
                   "$appdir/usr/share/applications" \
                   "$appdir/usr/share/icons/hicolor/256x256/apps" \
                   "$appdir/opt/hackdigest"
          cp -R dist/. "$appdir/opt/hackdigest/"
          cat > "$appdir/usr/bin/hackdigest" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/../../opt/hackdigest/bin/HackDigest" "$@"
          EOF
          chmod 755 "$appdir/usr/bin/hackdigest"
          cat > "$appdir/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/hackdigest" "$@"
          EOF
          chmod 755 "$appdir/AppRun"
          cat > "$appdir/hackdigest.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=HackDigest
          GenericName=Hacker News reader
          Comment=Hacker News with built-in translation and AI digests
          Exec=hackdigest
          Icon=hackdigest
          Terminal=false
          Categories=Network;Utility;
          EOF
          cp "$appdir/hackdigest.desktop" "$appdir/usr/share/applications/hackdigest.desktop"
          convert icon-1024.png -resize 256x256 "$appdir/hackdigest.png"
          cp "$appdir/hackdigest.png" "$appdir/usr/share/icons/hicolor/256x256/apps/hackdigest.png"
          ln -s hackdigest.png "$appdir/.DirIcon"
          ./"$asset" --no-appstream "$appdir" "hackdigest-$VERSION-linux-${{ matrix.arch }}.AppImage"

      # The AppImage carries the same payload the dist/ smoke just drove
      # through both transports; its own smoke proves the AppRun wiring
      # boots the app in the production native shape (self-terminating
      # assertion, non-zero on any failure).
      - name: AppImage native selftest
        run: |
          set -euo pipefail
          export WEBKIT_DISABLE_DMABUF_RENDERER=1 APPIMAGE_EXTRACT_AND_RUN=1
          data_dir="$(mktemp -d)"
          export HACKDIGEST_SELFTEST=1 HACKDIGEST_DATA_DIR="$data_dir"
          app="hackdigest-$VERSION-linux-${{ matrix.arch }}.AppImage"
          setsid xvfb-run -a "./$app" &
          run_pid=$!
          trap 'kill -9 -- "-$run_pid" 2>/dev/null || true' exit
          deadline=$((SECONDS + 120))
          while kill -0 "$run_pid" 2>/dev/null && [ "$SECONDS" -lt "$deadline" ]; do
            sleep 2
          done
          if kill -0 "$run_pid" 2>/dev/null; then
            echo "::error::AppImage selftest did not terminate in 120s"
            exit 1
          fi
          status=0
          wait "$run_pid" || status=$?
          [ "$status" -eq 0 ] || { echo "::error::AppImage selftest failed (exit $status)"; exit 1; }

      # Portable zip: same self-contained tree the tar.gz carries.
      - name: Portable zip (self-contained folder at the archive root)
        run: |
          set -euo pipefail
          stage="$(mktemp -d)/HackDigest"
          mkdir -p "$stage"
          cp -R dist/. "$stage/"
          ( cd "$(dirname "$stage")" && zip -qry "$GITHUB_WORKSPACE/hackdigest-$VERSION-linux-${{ matrix.arch }}.zip" HackDigest )

      - name: Per-asset .sha256 sidecars
        run: |
          set -euo pipefail
          for f in hackdigest-$VERSION*; do
            case "$f" in
              *.sha256) ;;
              *) [ -f "$f" ] || continue; [ -f "$f.sha256" ] || sha256sum "$f" > "$f.sha256" ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            hackdigest-*-linux-${{ matrix.arch }}.tar.gz
            hackdigest-*-linux-${{ matrix.arch }}.tar.gz.sha256
            hackdigest-*-linux-${{ matrix.arch }}.deb
            hackdigest-*-linux-${{ matrix.arch }}.deb.sha256
            hackdigest-*-linux-*.rpm
            hackdigest-*-linux-*.rpm.sha256
            hackdigest-*-linux-${{ matrix.arch }}.AppImage
            hackdigest-*-linux-${{ matrix.arch }}.AppImage.sha256
            hackdigest-*-linux-${{ matrix.arch }}.zip
            hackdigest-*-linux-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error

  windows:
    name: Windows x64 MSI
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: Bogdanp/setup-racket@v1.15
        with:
          version: stable
          distribution: full

      - name: Install glaze
        run: raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#671ea4dcacbfbfedd74a167de8ec9c1a53db51d6

      # the updater verifies manifests through the crypto package (libcrypto
      # FFI bundled with the Racket distribution)
      - name: Install crypto
        run: raco pkg install --auto --no-docs --skip-installed crypto

      - name: Install WiX 5.0.2
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package app and MSI installer
        shell: bash
        run: |
          raco glaze build \
            --entry backend/main.rkt \
            --name HackDigest \
            --version "$VERSION" \
            --publisher 'Turing Lambda' \
            --identifier 'TuringLambda.HackDigest' \
            --out dist \
            --installer
          test -f dist/HackDigest.msi || { echo "::error::dist/HackDigest.msi missing"; exit 1; }
          test -f dist/HackDigest.exe || { echo "::error::dist/HackDigest.exe missing"; exit 1; }

      - name: Validate MSI metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Resolve-Path 'dist/HackDigest.msi').Path
          wix msi validate $msi
          $wxs = Join-Path $env:RUNNER_TEMP 'hackdigest-release.wxs'
          wix msi decompile $msi -o $wxs
          [xml] $xml = Get-Content -Raw $wxs
          $package = $xml.Wix.Package
          if ($package.Name -ne 'HackDigest') { throw "unexpected MSI name: $($package.Name)" }
          if ($package.Manufacturer -ne 'Turing Lambda') { throw "unexpected MSI publisher: $($package.Manufacturer)" }
          if ($package.Version -ne $env:VERSION) { throw "unexpected MSI version: $($package.Version)" }
          if (-not $package.ProductCode -or -not $package.UpgradeCode) { throw 'MSI is missing ProductCode or UpgradeCode' }

      - name: Flat-stage native DLLs beside the executable
        shell: pwsh
        run: |
          # raco distribute leaves loader DLLs (e.g. WebView2Loader.dll)
          # inside dist/lib; a Windows exe only probes its own directory,
          # so copy every collected DLL next to dist/HackDigest.exe.
          Get-ChildItem -Path dist -Recurse -Filter *.dll |
            Where-Object { $_.DirectoryName -ne (Resolve-Path 'dist').Path } |
            Copy-Item -Destination (Resolve-Path 'dist').Path -Force
          Get-ChildItem dist -Filter *.dll | Select-Object -ExpandProperty Name

      - name: Ensure WebView2 Runtime (Evergreen)
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          if (Test-Path $key) { Write-Host "WebView2 Runtime present: $((Get-ItemProperty $key).pv)"; exit 0 }
          Write-Host "WebView2 Runtime missing; installing via Evergreen Bootstrapper"
          Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/?linkid=2099617' -OutFile "$env:RUNNER_TEMP\webview2-bootstrapper.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\webview2-bootstrapper.exe" -Wait -PassThru -ArgumentList '/silent','/install'
          if ($p.ExitCode -ne 0) { throw "WebView2 bootstrapper exited $($p.ExitCode)" }

      # Two-phase smoke (see the macOS job for the rationale). The
      # packaged exe asserts its own native render via HACKDIGEST_SELFTEST,
      # then the HTTP adapter is probed over loopback.
      - name: Native launch selftest (packaged binary, production transport)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $env:RUNNER_TEMP 'hd-selftest-data'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $env:HACKDIGEST_DATA_DIR = $dataDir
          $env:HACKDIGEST_SELFTEST = '1'
          $out = Join-Path $env:RUNNER_TEMP 'hd-selftest.stdout.log'
          $err = Join-Path $env:RUNNER_TEMP 'hd-selftest.stderr.log'
          $proc = Start-Process -FilePath (Resolve-Path 'dist/HackDigest.exe').Path -PassThru `
            -WorkingDirectory (Resolve-Path 'dist').Path `
            -RedirectStandardOutput $out -RedirectStandardError $err
          $waitStartUtc = [DateTime]::UtcNow
          $deadline = $waitStartUtc.AddSeconds(120)
          try {
            # Poll the OS process table instead of Process.WaitForExit: on
            # these runners the managed wait reported a false timeout (and a
            # stale 1601 exit time) while HasExited was true with exit code
            # 0 — the same false-timeout class ci.yml fixed in 2b7dde6 /
            # 982ad4a (issue #26). A launcher that is gone from the table
            # has exited; the exit code below is still the gate.
            while ((Get-Process -Id $proc.Id -ErrorAction SilentlyContinue) -and
                   ([DateTime]::UtcNow -lt $deadline)) {
              if ($proc.HasExited) { break }
              Start-Sleep -Milliseconds 250
            }
            $live = Get-Process -Id $proc.Id -ErrorAction SilentlyContinue
            if ($live) {
              Write-Host '::group::Windows packaged selftest diagnostics'
              Write-Host "launcher pid=$($live.Id) name=$($live.ProcessName) threads=$($live.Threads.Count) handles=$($live.HandleCount)"
              $live.Threads | Select-Object -First 20 Id,ThreadState,WaitReason | Format-Table | Out-String | Write-Host
              Write-Host "launcher wait-start-utc=$($waitStartUtc.ToString('o')) wait-end-utc=$([DateTime]::UtcNow.ToString('o'))"
              Write-Host '::endgroup::'
              Stop-Process -Id $live.Id -Force -ErrorAction SilentlyContinue
              throw 'native selftest did not terminate in 120s'
            }
            for ($i = 0; $i -lt 20 -and -not $proc.HasExited; $i++) {
              Start-Sleep -Milliseconds 100
            }
            if (-not $proc.HasExited) {
              throw 'launcher left the process table but its exit state is unavailable'
            }
            Write-Host "launcher exited code=$($proc.ExitCode) wait-start-utc=$($waitStartUtc.ToString('o')) wait-end-utc=$([DateTime]::UtcNow.ToString('o'))"
            if ($proc.ExitCode -ne 0) { throw "native selftest failed (exit $($proc.ExitCode))" }
            Write-Host "native selftest passed (window opened, page rendered, capture taken)"
          } finally {
            if (Test-Path $out) { Get-Content $out }
            if (Test-Path $err) { Get-Content $err }
            Remove-Item Env:HACKDIGEST_SELFTEST -ErrorAction SilentlyContinue
          }

      - name: HTTP adapter smoke (packaged binary serves API and frontend)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dataDir = Join-Path $env:RUNNER_TEMP 'hd-smoke-data'
          New-Item -ItemType Directory -Path $dataDir -Force | Out-Null
          $env:HACKDIGEST_DATA_DIR = $dataDir
          $env:HACKDIGEST_TRANSPORT = 'http'
          $env:GLAZE_API_TOKEN = 'smoke-token'
          $outLog = Join-Path $env:RUNNER_TEMP 'hd-smoke-out.log'
          $errLog = Join-Path $env:RUNNER_TEMP 'hd-smoke-err.log'
          # Kill every HackDigest process tree and verify it actually left
          # the OS process table. The .NET Process layer on these runners
          # has produced false signals in both directions — a stale
          # "exited, code 0" while the process lives (issue #37: the
          # selftest instance lingered in exit processing for 4+ minutes
          # holding the single-instance mutex) and flaky null enumeration —
          # so the kill goes through taskkill (independent enumeration,
          # tree kill for the WebView2 children) and the verification
          # polls the table.
          function Clear-HackDigest {
            foreach ($i in 1..20) {
              $left = Get-Process HackDigest -ErrorAction SilentlyContinue
              if (-not $left) { return $true }
              foreach ($p in $left) { taskkill /F /T /PID $p.Id 2>&1 | Out-Null }
              Start-Sleep -Seconds 1
            }
            return -not (Get-Process HackDigest -ErrorAction SilentlyContinue)
          }
          # The single-instance guard is a session-scoped named kernel
          # mutex (Local\Glaze-<sha1(app-id)>, glaze #88); its handle lives
          # until the holder process exits, so any lingering selftest
          # instance blocks this second launch. Clear and VERIFY before
          # starting.
          if (-not (Clear-HackDigest)) {
            Get-Process |
              Where-Object { $_.Name -match 'HackDigest|msedgewebview2' } |
              Select-Object Id,Name,StartTime,Path |
              Format-Table | Out-String | Write-Host
            throw 'selftest instance still in the process table after verified cleanup'
          }
          $proc = $null
          foreach ($attempt in 1..15) {
            $proc = Start-Process -FilePath (Resolve-Path 'dist/HackDigest.exe').Path -PassThru `
              -WorkingDirectory (Resolve-Path 'dist').Path `
              -RedirectStandardOutput $outLog -RedirectStandardError $errLog
            Start-Sleep -Seconds 3
            if (-not $proc.HasExited) { break }
            $early = (Get-Content $outLog -ErrorAction SilentlyContinue) -join ' '
            if ($early -match 'another instance is running') {
              Write-Host "attempt ${attempt}: instance lock held; waiting for it to clear"
              if ($attempt -eq 1) {
                # Forensics for issue #37: the single-instance mutex is
                # Local\Glaze-<sha1(app-id)> (app-id "hackdigest", glaze
                # sys-windows.rkt). Its handle is non-inheritable, so any
                # holder must have opened it by name — enumerate who, plus
                # probe the object independently and check ownership.
                Write-Host '::group::instance-lock forensics'
                try {
                  Invoke-WebRequest -UseBasicParsing 'https://live.sysinternals.com/handle.exe' -OutFile "$env:RUNNER_TEMP\handle.exe" -TimeoutSec 60
                  & "$env:RUNNER_TEMP\handle.exe" -accepteula -nobanner -a Glaze- 2>&1 | Write-Host
                } catch { Write-Host "handle.exe unavailable: $($_.Exception.Message)" }
                Get-Process |
                  Where-Object { $_.Name -match 'HackDigest|msedgewebview2|conhost' } |
                  Select-Object Id,Name,StartTime,Path |
                  Format-Table | Out-String | Write-Host
                try {
                  $m = [System.Threading.Mutex]::OpenExisting('Local\Glaze-29303c8537c9016435ac699f0d8cae92f9aacab6')
                  # WaitOne(0) acquiring means no thread owns the mutex (a
                  # live holder would time out); an abandoned mutex is
                  # ACQUIRED by the exception path and must be released.
                  $probe = 'held-by-someone'
                  try {
                    if ($m.WaitOne(0)) { $probe = 'exists-unowned'; $m.ReleaseMutex() }
                  } catch [System.Threading.AbandonedMutexException] {
                    $probe = 'exists-abandoned'; $m.ReleaseMutex()
                  }
                  Write-Host "mutex probe: $probe (independent process view)"
                  $m.Dispose()
                } catch { Write-Host "mutex probe: $($_.Exception.Message)" }
                Write-Host '::endgroup::'
              }
              if (-not (Clear-HackDigest)) {
                throw 'instance-lock holder survived taskkill /F /T — see the forensics above'
              }
              Start-Sleep -Seconds 5
            } else {
              throw "packaged app exited early (exit code $($proc.ExitCode)): $early"
            }
          }
          if (-not $proc -or $proc.HasExited) { throw 'packaged app never stayed up across retries' }
          try {
            # The app process can hold several listening sockets (single-
            # instance guard, HTTP server), and which one comes first
            # is not stable — probe every port and let the health endpoint
            # decide which one is the HTTP server.
            $health = $null
            $port = $null
            foreach ($try in 1..3) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { throw "packaged app exited early (exit code $($proc.ExitCode))" }
              $ports = Get-NetTCPConnection -OwningProcess $proc.Id -State Listen -ErrorAction SilentlyContinue |
                Select-Object -ExpandProperty LocalPort -Unique
              Write-Host "listen candidates: $($ports -join ', ')"
              foreach ($p in $ports) {
                try {
                  $health = Invoke-WebRequest -UseBasicParsing -NoProxy -Headers @{ 'X-Glaze-Token' = 'smoke-token' } -Uri "http://127.0.0.1:$p/api/health" -TimeoutSec 20
                  $port = $p
                  break
                } catch { Write-Host "port ${p}: $($_.Exception.Message)" }
              }
              if ($health) { break }
              if ($try -eq 3) { throw "health check failed after 3 tries across ports: $($ports -join ', ')" }
              Start-Sleep -Seconds 5
            }
            if ($health.Content -notmatch '"ok":true') { throw "health check failed: $($health.Content)" }
            $front = Invoke-WebRequest -UseBasicParsing -NoProxy -Uri "http://127.0.0.1:$port/" -TimeoutSec 20
            if ($front.StatusCode -ne 200) { throw "frontend returned $($front.StatusCode)" }
          } finally {
            Remove-Item Env:HACKDIGEST_TRANSPORT -ErrorAction SilentlyContinue
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if ($proc.HasExited -and $proc.ExitCode -ne 0) {
              Write-Host "::group::smoke stdout"
              if (Test-Path $outLog) { Get-Content $outLog }
              Write-Host "::endgroup::"
              Write-Host "::group::smoke stderr"
              if (Test-Path $errLog) { Get-Content $errLog }
              Write-Host "::endgroup::"
            }
          }

      - name: Name the installer artifact
        shell: bash
        run: mv dist/HackDigest.msi "hackdigest-$VERSION-windows-x64.msi"

      # Portable zip: everything the MSI installs, runnable from anywhere.
      # The MSI is moved out first, so what remains in dist/ is exactly the
      # portable payload (exe + flat loader DLLs + lib/ + public/).
      - name: Portable zip (self-contained folder at the archive root)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = "hackdigest-$env:VERSION-windows-x64"
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Path $stage | Out-Null
          Get-ChildItem dist | Copy-Item -Destination $stage -Recurse -Force
          Compress-Archive -Path $stage -DestinationPath "hackdigest-$env:VERSION-windows-x64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - name: Per-asset .sha256 sidecars
        shell: bash
        run: |
          set -euo pipefail
          for f in hackdigest-*-windows-x64.msi hackdigest-*-windows-x64.zip; do
            [ -f "$f" ] || continue
            sha256sum "$f" > "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            hackdigest-*-windows-x64.msi
            hackdigest-*-windows-x64.msi.sha256
            hackdigest-*-windows-x64.zip
            hackdigest-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Publish
    needs: [macos, linux, windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Signing the update feed needs the same racket the app ships with
      # (glaze/update schema structs + the crypto package's libcrypto FFI).
      - uses: Bogdanp/setup-racket@v1.15
        with:
          architecture: x64
          version: stable
          distribution: full

      - name: Install glaze and crypto
        run: |
          raco pkg install --auto --no-docs --skip-installed git+https://github.com/turlamai/glaze.git#671ea4dcacbfbfedd74a167de8ec9c1a53db51d6 crypto

      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten artifact dirs
        run: |
          # Depth-agnostic: upload-artifact can nest files (its LCA rule
          # preserves path prefixes), so pull every file up to dist/ and
          # drop whatever directories remain.
          find dist -mindepth 2 -type f -exec mv {} dist/ \;
          find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -la dist/
      - name: Sign and require trusted update feed (update-manifest.json)
        env:
          UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.UPDATE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" == v* ]] || { echo "::error::release publishing requires a version tag"; exit 1; }
          [[ -n "${UPDATE_ED25519_PRIVATE_KEY:-}" ]] || {
            echo "::error::UPDATE_ED25519_PRIVATE_KEY missing; refusing unsigned release"
            exit 1
          }
          umask 077
          KEY_PEM="$RUNNER_TEMP/update-signing-key.pem"
          trap 'rm -f "$KEY_PEM"' EXIT
          printf '%s\n' "$UPDATE_ED25519_PRIVATE_KEY" > "$KEY_PEM"
          scripts/make-update-manifest.sh "$GITHUB_REF_NAME" dist "$KEY_PEM"
          test -s dist/update-manifest.json || {
            echo "::error::Signed update manifest missing; refusing to publish"
            exit 1
          }
      - name: Verify all versioned release payloads and stage public assets
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          mkdir -p public
          for suffix in \
            macos-arm64.dmg macos-arm64.zip macos-x64.dmg macos-x64.zip \
            windows-x64.msi windows-x64.zip \
            linux-arm64.tar.gz linux-arm64.zip linux-x64.tar.gz linux-x64.zip \
            linux-arm64.deb linux-x64.deb \
            linux-arm64.AppImage linux-x64.AppImage; do
            name="hackdigest-$VERSION-$suffix"
            test -s "dist/$name" || { echo "::error::Missing $name"; exit 1; }
            cp "dist/$name" public/
          done
          for arch in aarch64 x86_64; do
            rpm="$(find dist -maxdepth 1 -type f -name "hackdigest-$VERSION-*-linux-$arch.rpm" -print -quit)"
            test -s "$rpm" || { echo "::error::Missing RPM $arch"; exit 1; }
            cp "$rpm" public/
          done
          test -s dist/update-manifest.json
          cp dist/update-manifest.json public/
          (cd public && sha256sum hackdigest-* | LC_ALL=C sort -k2 > SHA256SUMS && sha256sum -c SHA256SUMS)
          test "$(grep -c '^' public/SHA256SUMS)" -eq 16
      - name: Publish release (notes from CHANGELOG)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$GITHUB_REF_NAME" | cut -c2-)"
          awk -v header="## $VERSION" '
            index($0, header) == 1 {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > /tmp/notes.md
          test -s /tmp/notes.md || { echo "::error::Missing CHANGELOG section $VERSION"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" -R turlamai/hackdigest >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" -R turlamai/hackdigest --notes-file /tmp/notes.md
            gh release upload "$GITHUB_REF_NAME" public/* --clobber -R turlamai/hackdigest
          else
            gh release create "$GITHUB_REF_NAME" public/* \
              -R turlamai/hackdigest \
              --title "HackDigest $VERSION" \
              --notes-file /tmp/notes.md
          fi
          gh release view "$GITHUB_REF_NAME" -R turlamai/hackdigest --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -f "public/$name" ]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$name" --yes -R turlamai/hackdigest
              fi
            done
      - name: Attest public build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: public/*
