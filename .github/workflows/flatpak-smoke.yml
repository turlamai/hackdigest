name: Flatpak smoke

# Validation leg for the Flatpak bundle pipeline without a release: runs
# the exact steps of release.yml's Flatpak stage against the latest
# published release payload, on both architectures, and uploads the
# bundle as an artifact. It runs automatically when flatpak/ or the
# release workflow changes and never publishes anything.
on:
  workflow_dispatch:
  push:
    paths:
      - flatpak/**
      - .github/workflows/flatpak-smoke.yml
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Flatpak smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak + flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
      - name: Fetch the published release payload
        run: |
          set -euo pipefail
          # The newest non-draft release's payload for this arch; the smoke
          # test validates the pipeline, not a specific version.
          VERSION="$(gh release list -R turlamai/hackdigest --limit 5 --json tagName,isDraft --jq '.[] | select(.isDraft|not) | .tagName' | head -1 | sed 's/^v//')"
          echo "Smoke payload version: ${VERSION}"
          gh release download "v${VERSION}" -R turlamai/hackdigest \
            -p "hackdigest-${VERSION}-linux-${ARCH}.tar.gz" -D . --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
      - name: Build the bundle (same steps as the release leg)
        run: |
          set -euo pipefail
          VERSION="$(ls hackdigest-*-linux-*.tar.gz | head -1 | sed -E 's/hackdigest-([^-]+)-linux-.*/\1/')"
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in x64) FPARCH=x86_64 ;; arm64) FPARCH=aarch64 ;; esac
          flatpak --user remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            "org.gnome.Platform/${FPARCH}/50" "org.gnome.Sdk/${FPARCH}/50"
          SHA="$(sha256sum "hackdigest-${VERSION}-linux-${ARCH}.tar.gz" | cut -d' ' -f1)"
          sed -e "s/__VERSION__/${VERSION}/" -e "s/__ARCH__/${ARCH}/" \
              -e "s/__SHA256__/${SHA}/" \
              flatpak/site.jrtx.hackdigest.yml > site.jrtx.hackdigest.gen.yml
          # --disable-rofiles-fuse: runners have no /dev/fuse.
          flatpak-builder --user --force-clean --disable-rofiles-fuse \
            --repo=flatpak-repo flatpak-build site.jrtx.hackdigest.gen.yml
          flatpak build-bundle flatpak-repo \
            "hackdigest-${VERSION}-linux-${ARCH}.flatpak" site.jrtx.hackdigest stable
          sha256sum "hackdigest-${VERSION}-linux-${ARCH}.flatpak" \
            > "hackdigest-${VERSION}-linux-${ARCH}.flatpak.sha256"
      - name: Sandbox execution check
        run: |
          set -euo pipefail
          sudo apt-get install --yes xvfb x11-utils
          Xvfb :99 -screen 0 1024x768x24 & xvfb_pid=$!
          sleep 1
          # Install the bundle from the local file: the runtime ref is
          # already present, so nothing reaches for the network here.
          DISPLAY=:99 flatpak --user install -y --noninteractive \
            ./hackdigest-*-linux-*.flatpak
          # No GPU on the runner — the renderer switches the release
          # smokes use. HackDigest self-asserts its page render only with
          # HACKDIGEST_SELFTEST; here the gates are the sandboxed process
          # being alive and the WebKitGTK window mapping on the display.
          # First paint inside a cold sandbox (WebKit user-dir bootstrap
          # plus the startup update check) can take a while — poll for the
          # window instead of sleeping a fixed few seconds.
          DISPLAY=:99 flatpak run \
            --env=WEBKIT_DISABLE_DMABUF_RENDERER=1 --env=LIBGL_ALWAYS_SOFTWARE=1 \
            site.jrtx.hackdigest > app-run.log 2>&1 & run_pid=$!
          for _ in $(seq 1 20); do
            flatpak ps --columns=application | grep -q site.jrtx.hackdigest && break
            sleep 1
          done
          # The sandboxed process is alive under its own instance.
          flatpak ps --columns=application | grep site.jrtx.hackdigest
          # The window mapped on the display and the embedded backend
          # booted (the GLZ1 runtime layout resolves through
          # /proc/self/exe inside the sandbox).
          window=""
          for _ in $(seq 1 30); do
            if DISPLAY=:99 xwininfo -root -tree 2>/dev/null | grep -qi hackdigest; then
              window="yes"
              break
            fi
            kill -0 "$run_pid" 2>/dev/null || { echo "::error::sandboxed app exited early"; tail -20 app-run.log || true; exit 1; }
            sleep 2
          done
          [ -n "$window" ] || { echo "::error::no HackDigest window on the display; app log:"; tail -40 app-run.log || true; exit 1; }
          kill "$run_pid" 2>/dev/null || pkill -f site.jrtx.hackdigest || true
          kill "$xvfb_pid" 2>/dev/null || true
      - name: Dump build dirs (diagnosis)
        if: failure()
        run: |
          find .flatpak-builder/build -maxdepth 3 | head -40 || true
          find . -maxdepth 2 -name "hackdigest-linux-*" -o -maxdepth 2 -name "*.tar.gz" | head -10
          tail -40 app-run.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-smoke-${{ matrix.arch }}
          path: hackdigest-*.flatpak*
          if-no-files-found: error
